# Enum for the time_of_day UI dropdown on assemble_ingredients.
# Scenes can carry an optional `time_affinity: [...]` to express
# which entries belong to which times — see harbor's "Harbor lights
# blinking awake" (dawn) or town's "Foot traffic fading at dusk".
time_of_day:
  - dawn
  - morning
  - afternoon
  - evening
  - night

recipe_defaults:
  motif: mind_worm
  arc_shape: st_johns_standard
  time_of_day: morning
  characters_in_play:
    - Southwick
  locations_in_play:
    - harbor
    - cafe
    - town
  voice_notes: St. John's diary, first-person, sensory-dense
  # Fallback beat picks if the UI selections are empty.
  scene: Fog rolling into the harbor
  arrival: Southwick folds his newspaper carefully
  disturbance: People repeating slogans without knowing their origin
  reflection: Ideas move through towns like fog
  realization: The loudest ideas are rarely the wisest

# ─── Story Spine atoms ─────────────────────────────────────────────
# Menu of atoms consumed by the story_spine step. Each entry is the
# smallest reusable dramatic unit. The spine generator receives the
# selected atoms verbatim and returns a deterministic JSON plan.
#
# UI: characters.protagonist / characters.antagonist / characters.witness
# each render as a dropdown backed by story_atoms.characters (all optional
# except protagonist). external_problem / internal_obstacle /
# missed_opportunity / primary_consequence each render as a single dropdown
# backed by their respective list.

story_atoms:
  characters:
    - id: tommy
      label: "Tommy"
      role_hints: [ordinary, restless]
      canonical_phrasing: "Tommy"
    - id: old_girlfriend
      label: "Old girlfriend"
      role_hints: [past-relationship, foil]
      canonical_phrasing: "his old girlfriend"
    - id: southwick
      label: "Southwick"
      role_hints: [observer, reflective]
      canonical_phrasing: "Southwick"
    - id: the_stranger
      label: "The stranger"
      role_hints: [outsider, catalyst]
      canonical_phrasing: "a stranger"
    - id: the_old_friend
      label: "Old friend"
      role_hints: [past, familiar]
      canonical_phrasing: "an old friend"
    - id: the_child
      label: "The child"
      role_hints: [innocent, witness]
      canonical_phrasing: "the child"
    - id: the_barkeep
      label: "The barkeep"
      role_hints: [confidant, townie]
      canonical_phrasing: "the barkeep"
    - id: the_neighbor
