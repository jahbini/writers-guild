  # Interpretive lens the finished chapter reads through. Does not
  # change events (that's what the axis atoms do); shapes how the
  # narrator interprets them. Each lens references substrate files
  # under ontologies/ or library/ that downstream stages may consult.
  lenses:
    - id: mind_worm
      label: "Mind-worm"
      substrate: null
      interpretive_note: "A recurring intrusive idea colors the narration; every scene bends around it."
    - id: tarot_major_arcana
      label: "Tarot (Major Arcana)"
      substrate: ontologies/four_forces_tarot_master.json
      interpretive_note: "Beats named through Major Arcana cards; the card's shadow shapes each turn."
    - id: four_forces
      label: "Four Forces"
      substrate: ontologies/four_forces_tarot_master.json
      interpretive_note: "Events read through Logos / Ethos / Pathos / Anima; each scene shifts the balance."
    - id: i_ching_hexagram
      label: "I Ching hexagram"
      substrate: library/hexagrams.yaml
      interpretive_note: "One hexagram frames the chapter's movement; changing lines mark the turns."
