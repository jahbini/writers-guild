  characters:
    Southwick:
      - folds his newspaper carefully
      - raises an eyebrow
      - taps the table lightly
      - adjusts his glasses
      - watches the fog outside
      - nods slowly
      - glances at the clock
      - clears his throat
      - folds his hands
      - taps his spoon
      - sips tea slowly
      - studies the room
    Roger:
      - stirs coffee absentmindedly
      - scratches his beard thoughtfully
      - shrugs with a sigh
      - points toward the harbor
      - tilts his head skeptically
      - drums his fingers
      - rubs his temples
      - looks around the room
      - sighs deeply
      - leans back heavily
      - watches people outside
      - finishes his coffee
    Tommy:
      - bursts in talking loudly
      - waves his phone in the air
      - drops into the chair
      - laughs at his own theory
      - spreads his arms dramatically
      - leans across the table
      - spins a wild explanation
      - gestures toward the street
      - points at the sky
      - laughs again
      - leans back triumphantly
      - nods emphatically
    A stranger:
      - leans over the table
      - warms hands on a mug
    The bartender:
      - wipes the counter slowly
      - raises an eyebrow
    A fisherman:
      - sets down his hat
      - scratches his chin
    A student:
      - opens a notebook
      - asks a question
    The waitress:
      - refills a cup silently
      - smiles briefly
    A passerby:
      - pauses to listen
      - shakes their head
  disturbances:
    # Concrete event-shaped disturbances — something occurs, something
    # shifts, something demands the narrator notice. Pick from here when
    # you want the diary to TELL A SMALL STORY rather than describe one.
    # Cast and locations are constrained to the library's named world:
    # Southwick / Roger / Tommy / the bartender / the waitress / a
    # stranger / a fisherman / a student / a passerby, in cafe / harbor
    # / street / town.
    #
    # The thematic sub-buckets below (repetition / fear / outrage / etc.)
    # are the abstract "true-of-the-world" framings; pick from those when
    # you want atmospheric trouble rather than a particular incident.
    events:
      # ── cafe ───────────────────────────────────────────────────────
      - The coffee grinder cuts out mid-pour and the room notices the silence
      - A glass slips off the bar and rolls without breaking
      - Southwick stops talking mid-sentence and looks at the door
      - Roger pushes his cup away half-full and stares at it
      - The waitress drops a check on a table where nobody is sitting
      - A stranger settles into Southwick's usual chair before he arrives
      - The radio behind the counter switches stations on its own
      - A passerby ducks in for shelter and stays through two refills
      - The bartender slides a drink in front of me I didn't order
      - Tommy points at me to back him up on something I didn't say
      - The cafe falls quiet when a name nobody wants to say comes up
      # ── harbor ─────────────────────────────────────────────────────
      - A boat horn blows the wrong number of times
      - A fisherman drops his catch on the pier and starts swearing quietly
      - Gulls dive at someone carrying a paper bag down the dock
      - The ferry pulls in carrying nobody at all
      - The tide brings something dark up against the seawall
      - A rope on one of the boats slips and the boat starts drifting
      - The harbor bell starts ringing on its own in the fog
      - Someone stands too long looking down at the water
      # ── street ─────────────────────────────────────────────────────
      - A car alarm goes off and nobody comes out to check
      - The streetlamp on the corner flickers and then stays dark
      - A passerby drops something and walks on without noticing
      - Two strangers cross the street to avoid each other
      - A street musician changes songs mid-verse without finishing
      - Rain starts suddenly and the street empties
      # ── town ───────────────────────────────────────────────────────
      - Southwick walks past the cafe without coming in
      - A stranger reads the bulletin board for a long time and walks away
      - The town clock chimes the wrong hour
      - A piece of paper blows past in a direction the wind isn't going
