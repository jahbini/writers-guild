###
  Named emotional arc shapes for the diary pipeline.

  Each shape lists exactly five emotions, one per beat in the canonical
  order: scene, arrival, disturbance, reflection, realization.

  These guide assemble_ingredients (preferred emotion per beat) and are
  recorded in the ingredient bundle for the oracle composer.

  Add new shapes here. Reference them from data/jim_story_library.yaml
  via `arc_shape:` on a story entry.
###

arc_shapes:
  settling:
    desc: A day that begins at unease and resolves into quiet.
    emotions: [contentment, anxiety, fear, melancholy, resolve]

  spiral:
    desc: A day that tightens into agitation; nothing relieves.
    emotions: [calm, suspicion, fear, certainty, defeat]

  lift:
    desc: A day that opens upward; small recognitions accumulate into grace.
    emotions: [heaviness, recognition, small_joy, expansion, benediction]

  st_johns_standard:
    desc: Jim's diary default — wry attention to noticing.
    emotions: [contentment, anxiety, fear, contentment, frustration]
