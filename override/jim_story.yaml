pipeline: jim_story

# Runtime tuning for the jim_story recipe. Per GPT/CONVENTIONS.md, tuning
# lives here rather than in config/jim_story.yaml.

oracle_brief:
  # Sacred `mlx:` block. Keys are the canonical mlx_lm CLI flag names
  # (dashes, not underscores). The ledger's callMLX auto-injects these
  # so the step body only passes `prompt`.
  #
  # build/model4 is a symlink to a local quantized MLX model
  # (currently → /Users/jahbini/writediary/pipes/diary/build/model4).
  #
  # max-tokens: 400 truncated mid-JSON in earlier runs (brief +
  # structure_hints + transitions consumed the budget before
  # motif_thread/voice_target could close); 800 is comfortable.
  #
  # Sampling — without temp/top-p mlx_lm runs greedy and byte-identical
  # runs are produced every time.
  #   temp:  0    greedy / deterministic
  #          0.5  small variation
  #          0.7  meaningful variation (recommended)
  #          1.0+ loose; structured output may drift
  #   top-p: 0.95 keeps sampling in the high-probability tail
  #   seed:  unset = fresh runs; set an integer for reproducible tests
  mlx:
    model: build/model4
    max-tokens: 800
    temp: 0.7
    top-p: 0.95
