run:
  output_dir: out
  data_dir: data
  params_dir: params

artifacts:
  story_library:     { target: out/story_library.json }
  story_recipe:      { target: out/story_recipe.json }
  story_parts:       { target: out/story_parts.json }
  ingredient_bundle: { target: out/ingredient_bundle.json }
  diary_brief:       { target: out/diary_brief.json }
  diary_file:        { target: out/diary_file.json }

load_library:
  run: jim/load_library.coffee
  depends_on: []
  needs: []
  makes: [story_library]
  library_file: data/jim_story_library.yaml

# Canonical UI-facing step: 5 dropdowns for the beats; empty selection
# falls back to recipe_defaults in data/jim_story_library.yaml.
select_story_recipe:
  run: jim/select_story_recipe.coffee
  depends_on: [load_library]
  needs: [story_library]
  makes: [story_recipe]
  scene:       [ UI_grouped_dropdown, data/jim_story_library.yaml/library/scenes ]
  arrival:     [ UI_grouped_dropdown, data/jim_story_library.yaml/library/characters ]
  disturbance: [ UI_grouped_dropdown, data/jim_story_library.yaml/library/disturbances ]
  reflection:  [ UI_grouped_dropdown, data/jim_story_library.yaml/library/reflections ]
  realization: [ UI_grouped_dropdown, data/jim_story_library.yaml/library/realizations ]

# Materializes story_parts — the artifact downstream diary_ite consumes.
resolve_story_parts:
  run: jim/resolve_story_parts.coffee
  depends_on: [select_story_recipe]
  needs: [story_library, story_recipe]
  makes: [story_parts]

# ─── Experimental branch ─────────────────────────────────────────────
# assemble_ingredients + oracle_brief produce a unified narrative brief
# from the resolved story_parts. Optional: downstream diary_ite can
# ignore this and use story_parts directly.

assemble_ingredients:
  run: jim/assemble_ingredients.coffee
  depends_on: [resolve_story_parts]
  needs: [story_library, story_parts]
  makes: [ingredient_bundle]
  # Pick the day's trajectory and tone. Empty = use recipe_defaults.
  arc_shape:   [ UI_dropdown, data/jim_story_library.yaml/arc_shapes ]
  time_of_day: [ UI_dropdown, data/jim_story_library.yaml/time_of_day ]
  # Motif is now a lens selection — an interpretive frame the finished
  # chapter reads through. Field name kept as `motif` for compatibility
  # with existing coffee scripts; backing list is story_atoms.lenses.
  motif:       [ UI_dropdown, data/jim_story_library.yaml/story_atoms/lenses ]

oracle_brief:
  run: jim/oracle_brief.coffee
  depends_on: [assemble_ingredients]
  needs: [ingredient_bundle]
  makes: [diary_brief]
  # Runtime tuning (model, max_tokens) lives in override/jim_story.yaml
  # per GPT/CONVENTIONS.md.

# Final step — writes diary/<recipe>_<timestamp>.yaml so the UI's
# Diary Files panel surfaces every run as a separate item.
write_diary:
  run: jim/write_diary.coffee
  depends_on: [oracle_brief]
  needs: [ingredient_bundle, diary_brief]
  makes: [diary_file]
  recipe_name: jim_story
